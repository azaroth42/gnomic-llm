[project]
name = "gnomic"
version = "0.1.0"
description = "Gnomic Mau: a hidden-rule card game used as an LLM reasoning benchmark"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
litellm = ["litellm>=1.50"]
all = ["gnomic[anthropic,openai,gemini,litellm]"]
dev = ["pytest>=8"]

[project.scripts]
gnomic = "gnomic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
